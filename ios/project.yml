name: Mycroft
options:
  bundleIdPrefix: dev.mycroft
  deploymentTarget:
    iOS: '27.0'
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  ASN1:
    url: https://github.com/apple/swift-asn1
    from: 1.3.0
  Certificates:
    url: https://github.com/apple/swift-certificates
    from: 1.21.0
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    # main after 0.17.7: Gradium Phonon 31m on PocketTtsSmallManager (#1053), not in a release yet.
    revision: c79c4106b954f81205113c3343e5a7e59a1089b5
  PiDurableKit:
    url: https://github.com/finnvoor/PiDurableKit
    revision: 1305a72ffe5ea29a9f5e7d576a7cf9334189c1ef
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Mycroft:
    type: application
    platform: iOS
    sources:
      - path: Mycroft
        excludes: [Web/web-lib/**]
      - path: Shared
      - path: ../agent/generation-0
        buildPhase: resources
        type: folder
        name: generation-0
      - path: Mycroft/Web/web-lib
        buildPhase: resources
        type: folder
    dependencies:
      - package: PiDurableKit
      - package: Certificates
        product: X509
      - package: ASN1
        product: SwiftASN1
      - package: FluidAudio
      - target: MycroftActivity
    info:
      path: Mycroft/Info.plist
      properties:
        CFBundleDisplayName: Mycroft
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        UILaunchScreen:
          UIColorName: Canvas
        UIApplicationSupportsIndirectInputEvents: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [processing, audio]
        BGTaskSchedulerPermittedIdentifiers: ['$(PRODUCT_BUNDLE_IDENTIFIER).run']
        UIAppFonts: [JetBrainsMono.ttf, SchibstedGrotesk.ttf]
        NSMicrophoneUsageDescription: Mycroft listens while you dictate or talk to it.
        NSLocalNetworkUsageDescription: Mycroft connects to your machines running hands on this network.
        NSSupportsLiveActivities: true
        NSBonjourServices: [_mycroft-hands._tcp]
        ITSAppUsesNonExemptEncryption: false
    postCompileScripts:
      - name: Bundle hands
        basedOnDependencyAnalysis: false
        script: |
          # Copies the hands install script and release binaries (hands/scripts/build-release.sh) into the app,
          # so the phone can serve the one-line install. Missing pieces are skipped with a warning.
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          HANDS="${SRCROOT}/../hands"
          rm -rf "$DEST/hands-dist" && mkdir -p "$DEST/hands-dist"
          if [ -f "$HANDS/scripts/phone-install.sh" ]; then cp "$HANDS/scripts/phone-install.sh" "$DEST/"; else echo "warning: hands/scripts/phone-install.sh missing"; fi
          found=0
          for t in darwin-arm64 darwin-x86_64 linux-x86_64 linux-aarch64; do
            if [ -f "$HANDS/dist/hands-$t" ]; then cp "$HANDS/dist/hands-$t" "$DEST/hands-dist/"; found=1; fi
          done
          [ "$found" = 1 ] || echo "warning: no hands binaries in hands/dist (run hands/scripts/build-release.sh)"
          # Refuse to ship stale binaries: the bundled hands must be the version in hands/Cargo.toml.
          want="$(sed -n 's/^version = "\(.*\)"/\1/p' "$HANDS/Cargo.toml" | head -1)"
          if [ "$found" = 1 ] && [ "$(uname -m)" = arm64 ] && [ -f "$HANDS/dist/hands-darwin-arm64" ]; then
            have="$("$HANDS/dist/hands-darwin-arm64" version | awk '{print $2}')"
            if [ "$have" != "$want" ]; then
              echo "error: hands/dist has hands $have but hands/Cargo.toml is $want. Run hands/scripts/build-release.sh."
              exit 1
            fi
          fi
      - name: Bundle Fluid Speech Mini
        basedOnDependencyAnalysis: false
        script: |
          # Copies the dictation model (ios/scripts/fetch-fluid-speech.sh, ~240 MB) into the app. Without it, dictation
          # offers Apple's model only.
          MODEL="${SRCROOT}/Models/fluid-speech-mini"
          if [ -f "$MODEL/REVISION" ]; then
            DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/FluidSpeech"
            mkdir -p "$DEST"
            rsync -a --delete "$MODEL/model/" "$DEST/"
          else
            echo "warning: no Fluid Speech Mini in ios/Models (run ios/scripts/fetch-fluid-speech.sh); dictation will use Apple's model"
          fi
      - name: Bundle Phonon
        basedOnDependencyAnalysis: false
        script: |
          # Copies the conversation voice (ios/scripts/fetch-phonon.sh, ~150 MB) into the app. Without it, there is no
          # conversation mode.
          MODEL="${SRCROOT}/Models/phonon"
          if [ -f "$MODEL/REVISION" ]; then
            DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Phonon"
            mkdir -p "$DEST"
            rsync -a --delete "$MODEL/model/" "$DEST/"
          else
            echo "warning: no Phonon in ios/Models (run ios/scripts/fetch-phonon.sh); conversation mode will be off"
          fi
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: $(MYCROFT_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  MycroftActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: MycroftActivity
      - path: Shared
      - path: Mycroft/UI/Theme.swift
      - path: Mycroft/Resources/JetBrainsMono.ttf
        buildPhase: resources
      - path: Mycroft/Resources/SchibstedGrotesk.ttf
        buildPhase: resources
    info:
      path: MycroftActivity/Info.plist
      properties:
        CFBundleDisplayName: Mycroft
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        UIAppFonts: [JetBrainsMono.ttf, SchibstedGrotesk.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: $(MYCROFT_BUNDLE_ID).activity
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  MycroftUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MycroftUITests]
    dependencies:
      - target: Mycroft
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Mycroft
        SWIFT_VERSION: '5.0'
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
  MycroftTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MycroftTests
        excludes: [Fixtures/**]
      - path: MycroftTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Mycroft
      - package: PiDurableKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Mycroft.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Mycroft
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Mycroft:
    build:
      targets:
        Mycroft: all
        MycroftTests: [test]
        MycroftUITests: [test]
    test:
      targets: [MycroftTests, MycroftUITests]
